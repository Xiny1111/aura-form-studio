<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURA / FORM — 智能体光晕编辑器</title>
  <style>
    :root{--bg:#09080a;--panel:#111014;--line:rgba(255,255,255,.12);--muted:#87818b;--ink:#f3eff4;--accent:#ff4fd8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}button,input{font:inherit}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0d0b0e}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.14em;font-size:13px}.mark{width:27px;height:27px;border:1px solid #fff;display:grid;place-items:center;transform:rotate(45deg)}.mark i{font:15px Georgia;transform:rotate(-45deg);font-style:normal}.state{font-size:9px;color:#87818b;letter-spacing:.14em;text-transform:uppercase}.state:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7cf098;box-shadow:0 0 8px #7cf098;margin-right:8px}.actions{display:flex;gap:8px}.btn{height:35px;border:1px solid var(--line);background:#18151a;color:#eee;padding:0 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.primary{background:#eeeaf0;color:#171318;font-weight:700}.btn input{display:none}.layout{height:calc(100vh - 68px);display:grid;grid-template-columns:minmax(430px,1fr) 352px}.studio{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}.label{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-size:9px;color:#6b6570;letter-spacing:.2em}.stage{min-height:0;flex:1;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}.frame{height:min(70vh,680px);max-width:100%;aspect-ratio:9/16;border:1px solid rgba(255,255,255,.15);background:#030303;box-shadow:0 30px 90px #000;position:relative}.frame:after{content:"拖动智能体调整位置 · 双击归位";position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.12em;color:rgba(255,255,255,.5);white-space:nowrap;pointer-events:none}.frame video{display:none}.frame canvas{display:block;width:100%;height:100%;object-fit:contain;cursor:grab;touch-action:none}.frame canvas:active{cursor:grabbing}.transport{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}.play{width:34px;height:34px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:none;color:#fff;cursor:pointer}.time{font:10px monospace;color:#c8c2cb}.timeline{flex:1;height:2px;accent-color:#fff}.side{background:var(--panel);overflow-y:auto}.section{padding:19px 21px;border-bottom:1px solid var(--line)}.title{display:flex;justify-content:space-between;margin-bottom:14px;font-size:11px;letter-spacing:.06em}.title small{font-size:8px;color:#5d5761;letter-spacing:.18em}.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.shape{height:70px;border:1px solid var(--line);background:#171419;color:#d8d2db;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.shape b{font-size:23px}.shape span{font-size:9px;color:#77717b}.shape.on{border-color:var(--accent);background:linear-gradient(145deg,rgba(255,79,216,.17),#171419)}.colorline{display:flex;gap:8px}.colorwell{width:44px;height:36px;border:1px solid rgba(255,255,255,.25);padding:0;background:none}.colorwell input{width:100%;height:100%;opacity:0;cursor:pointer}.hex{height:36px;flex:1;border:1px solid var(--line);display:flex;align-items:center;padding:0 11px;font:10px monospace;color:#aaa4ad}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.swatches button{aspect-ratio:1;border-radius:50%;border:3px solid var(--panel);outline:1px solid transparent;cursor:pointer}.swatches button.on{outline-color:#fff}.range{display:block;margin-bottom:19px}.range:last-child{margin-bottom:0}.range div{display:flex;justify-content:space-between;font-size:10px;color:#8c8690;margin-bottom:10px}.range output{font:10px monospace;color:#ded8e1}.range input{width:100%;height:2px;accent-color:#eee}.note{margin:18px 21px;color:#635d66;font-size:9px;line-height:1.7}.note b{color:var(--accent)}.progress{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);transition:width .2s}.hidden{display:none}@media(max-width:760px){.state{display:none}.layout{height:auto;display:block}.studio{height:680px;border-right:0}.side{border-top:1px solid var(--line)}.frame{height:min(72vh,570px)}.actions .secondary{display:none}}@media(max-width:480px){.top{padding:0 10px}.brand{font-size:11px}.btn{padding:0 10px}.stage{padding:18px 12px}.studio{height:620px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark"><i>A</i></span>AURA / FORM</div><div class="state">实时浏览器合成</div><div class="actions"><label class="btn secondary">＋ 导入视频<input id="upload" type="file" accept="video/*"></label><button id="export" class="btn primary">导出视频 ↗</button></div></header>
  <main class="layout">
    <section class="studio"><div class="label"><span>PREVIEW / 预览</span><span>01</span></div><div class="stage"><div class="frame"><video id="video" src="public/agent-demo.mp4" playsinline muted loop></video><canvas id="canvas"></canvas></div></div><div class="transport"><button id="play" class="play">▶</button><span id="now" class="time">00:00</span><input id="seek" class="timeline" type="range" min="0" max="1" step=".01" value="0"><span id="total" class="time">00:00</span></div></section>
    <aside class="side"><div class="label"><span>CONTROLS / 控制</span><span>02</span></div><section class="section"><div class="title"><span>智能体形状</span><small>FORM</small></div><div id="shapes" class="shapes"><button class="shape on" data-shape="orb"><b>●</b><span>光球</span></button><button class="shape" data-shape="squircle"><b>▢</b><span>软方</span></button><button class="shape" data-shape="diamond"><b>◆</b><span>晶体</span></button><button class="shape" data-shape="drop"><b>♢</b><span>水滴</span></button><button class="shape" data-shape="star"><b>✦</b><span>星核</span></button><button class="shape" data-shape="capsule"><b>▰</b><span>胶囊</span></button></div></section><section class="section"><div class="title"><span>光晕颜色</span><small>AURA</small></div><div class="colorline"><label id="colorWell" class="colorwell"><input id="color" type="color" value="#ff4fd8"></label><div id="hex" class="hex">#FF4FD8</div></div><div id="swatches" class="swatches"></div></section><section class="section"><label class="range"><div><span>形状大小</span><output id="sizeOut">20%</output></div><input id="size" type="range" min="7" max="36" value="20"></label><label class="range"><div><span>光晕扩散</span><output id="glowOut">68</output></div><input id="glow" type="range" min="0" max="100" value="68"></label><label class="range"><div><span>不透明度</span><output id="opacityOut">96%</output></div><input id="opacity" type="range" min="10" max="100" value="96"></label></section><p class="note"><b>TIP</b> 视频只在你的浏览器中处理，不会上传到服务器。导出格式为 WebM。</p></aside>
  </main><div id="progress" class="progress hidden"></div>
  <script>
    const $=s=>document.querySelector(s), video=$('#video'),canvas=$('#canvas'),ctx=canvas.getContext('2d');
    const state={shape:'orb',color:'#ff4fd8',core:'#fff7fd',size:20,glow:68,opacity:96,x:50,y:51,exporting:false};
    const colors=['#ff4fd8','#7c6cff','#42d9ff','#82ff9d','#ffb84d','#ffffff'];
    colors.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>setColor(c);$('#swatches').append(b)});
    function setColor(c){state.color=c;$('#color').value=c;$('#hex').textContent=c.toUpperCase();$('#colorWell').style.background=c;[...$('#swatches').children].forEach(b=>b.classList.toggle('on',b.title===c))}setColor(state.color);
    function trace(shape,x,y,r){ctx.beginPath();if(shape==='orb')ctx.arc(x,y,r,0,Math.PI*2);else if(shape==='squircle')ctx.roundRect(x-r,y-r*.88,r*2,r*1.76,r*.48);else if(shape==='diamond'){ctx.moveTo(x,y-r*1.15);ctx.lineTo(x+r*.86,y);ctx.lineTo(x,y+r*1.15);ctx.lineTo(x-r*.86,y);ctx.closePath()}else if(shape==='drop'){ctx.moveTo(x,y-r*1.25);ctx.bezierCurveTo(x+r*.35,y-r*.63,x+r,y-r*.05,x+r*.78,y+r*.52);ctx.bezierCurveTo(x+r*.51,y+r*1.18,x-r*.51,y+r*1.18,x-r*.78,y+r*.52);ctx.bezierCurveTo(x-r,y-r*.05,x-r*.35,y-r*.63,x,y-r*1.25);ctx.closePath()}else if(shape==='star'){for(let i=0;i<16;i++){let a=-Math.PI/2+i*Math.PI/8,rr=i%2? r*.47:r*1.12,px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}else ctx.roundRect(x-r*.7,y-r*1.15,r*1.4,r*2.3,r*.7)}
    function draw(){if(video.readyState>=2){if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(video,0,0);let x=canvas.width*state.x/100,y=canvas.height*state.y/100,r=Math.min(canvas.width,canvas.height)*state.size/100,blur=state.glow/100*r*2.6;ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=state.opacity/100*.34;ctx.shadowColor=state.color;ctx.shadowBlur=blur*1.9;ctx.fillStyle=state.color;trace(state.shape,x,y,r*1.05);ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=state.opacity/100;ctx.shadowColor=state.color;ctx.shadowBlur=blur;let g=ctx.createRadialGradient(x-r*.28,y-r*.32,r*.05,x,y,r*1.05);g.addColorStop(0,'#fff');g.addColorStop(.22,state.core);g.addColorStop(.72,state.color);g.addColorStop(1,state.color+'cc');ctx.fillStyle=g;trace(state.shape,x,y,r);ctx.fill();ctx.restore()}$('#now').textContent=fmt(video.currentTime);$('#seek').value=video.currentTime||0;if(state.exporting&&video.duration){let p=video.currentTime/video.duration*100;$('#progress').style.width=p+'%';$('#export').textContent='渲染 '+Math.round(p)+'%'}requestAnimationFrame(draw)}requestAnimationFrame(draw);
    function fmt(n){n=Number.isFinite(n)?n:0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}
    video.onloadedmetadata=()=>{$('#seek').max=video.duration;$('#total').textContent=fmt(video.duration)};video.onplay=()=>$('#play').textContent='Ⅱ';video.onpause=()=>$('#play').textContent='▶';$('#play').onclick=()=>video.paused?video.play():video.pause();$('#seek').oninput=e=>video.currentTime=+e.target.value;
    $('#shapes').onclick=e=>{const b=e.target.closest('[data-shape]');if(!b)return;state.shape=b.dataset.shape;document.querySelectorAll('.shape').forEach(x=>x.classList.toggle('on',x===b))};$('#color').oninput=e=>setColor(e.target.value);
    [['size','sizeOut','%'],['glow','glowOut',''],['opacity','opacityOut','%']].forEach(([id,out,u])=>$('#'+id).oninput=e=>{state[id]=+e.target.value;$('#'+out).textContent=e.target.value+u});
    let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:state.x,py:state.y}};canvas.onpointermove=e=>{if(!drag)return;let r=canvas.getBoundingClientRect();state.x=Math.max(0,Math.min(100,drag.px+(e.clientX-drag.x)/r.width*100));state.y=Math.max(0,Math.min(100,drag.py+(e.clientY-drag.y)/r.height*100))};canvas.onpointerup=()=>drag=null;canvas.ondblclick=()=>{state.x=50;state.y=51};
    $('#upload').onchange=e=>{const f=e.target.files[0];if(f){video.src=URL.createObjectURL(f);video.load()}};
    $('#export').onclick=async()=>{if(!window.MediaRecorder||state.exporting)return;state.exporting=true;video.loop=false;video.currentTime=0;$('#progress').classList.remove('hidden');let stream=canvas.captureStream(30),src=video.captureStream?.();src?.getAudioTracks().forEach(t=>stream.addTrack(t));let type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8000000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='aura-form.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);state.exporting=false;video.loop=true;$('#export').textContent='导出视频 ↗';$('#progress').classList.add('hidden')};video.onended=()=>rec.state!=='inactive'&&rec.stop();rec.start(250);await video.play()};
  </script>
</body>
</html>
